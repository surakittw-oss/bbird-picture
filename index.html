<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            display: inline-block;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #1d1d1f;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        /* Hero Section */
        .hero {
            margin-top: 60px;
            padding: 80px 24px;
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 21px;
            color: #6e6e73;
            font-weight: 400;
        }

        /* Gallery */
        .gallery {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 24px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 10px;
            gap: 24px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            background: #f5f5f7;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
            display: block;
            object-fit: cover;
        }

        /* Footer */
        footer {
            background: #f5f5f7;
            padding: 40px 24px;
            text-align: center;
            margin-top: 100px;
        }

        footer p {
            color: #6e6e73;
            font-size: 14px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 18px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: 10px;
            }

            .nav-links a {
                display: none;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 10px;
            }
        }

        @media (min-width: 1025px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-content">
            <div class="logo" id="logoDisplay">
                <span class="logo-text">MY PORTFOLIO</span>
            </div>
            <div class="nav-links">
                <a href="#gallery">Gallery</a>
                <a href="#about">About</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 id="heroTitle">Capturing Moments</h1>
        <p id="heroDescription">Photography is the art of frozen time, the ability to store emotion and feelings within a frame.</p>
    </section>

    <!-- Gallery -->
    <section class="gallery" id="gallery">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Gallery items will be inserted here -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 <span id="footerText">My Photography Portfolio</span>. All rights reserved.</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        // Storage keys
        const STORAGE_KEY = 'portfolioData';

        // Default data
        const defaultData = {
            logoType: 'text',
            logo: 'MY PORTFOLIO',
            logoImage: null,
            title: 'Capturing Moments',
            description: 'Photography is the art of frozen time, the ability to store emotion and feelings within a frame.',
            footer: 'My Photography Portfolio',
            images: []
        };

        // Load data from localStorage
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : defaultData;
        }

        // Update logo display
        function updateLogoDisplay(data) {
            const logoDisplay = document.getElementById('logoDisplay');
            
            if (data.logoType === 'image' && data.logoImage) {
                logoDisplay.innerHTML = `<img src="${data.logoImage}" alt="Logo">`;
            } else {
                logoDisplay.innerHTML = `<span class="logo-text">${data.logo}</span>`;
            }
        }

        // Render gallery
        function renderGallery(images) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            if (images.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #6e6e73; padding: 40px;">Coming Soon...</p>';
                return;
            }
            
            images.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(img.url);
                
                const image = document.createElement('img');
                image.src = img.url;
                image.alt = img.name || 'Gallery image';
                image.loading = 'lazy';
                
                // Calculate grid row span after image loads
                image.onload = function() {
                    const rowSpan = Math.ceil((this.clientHeight + 24) / 10);
                    item.style.gridRowEnd = `span ${rowSpan}`;
                };
                
                item.appendChild(image);
                grid.appendChild(item);
            });
        }

        // Initialize page
        function initPage() {
            const data = loadData();
            
            // Update logo
            updateLogoDisplay(data);
            
            // Update other UI
            document.getElementById('heroTitle').textContent = data.title;
            document.getElementById('heroDescription').textContent = data.description;
            document.getElementById('footerText').textContent = data.footer;
            
            // Load gallery
            renderGallery(data.images || []);
        }

        // Open lightbox
        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close lightbox
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Initialize on load
        window.onload = initPage;
    </script>
</body>
</html>
