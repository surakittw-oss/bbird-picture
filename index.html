<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            display: inline-block;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #1d1d1f;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        /* Hero Section */
        .hero {
            margin-top: 60px;
            padding: 80px 24px;
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 21px;
            color: #6e6e73;
            font-weight: 400;
        }

        /* Gallery */
        .gallery {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 24px;
        }

        .gallery-grid {
            column-count: 3;
            column-gap: 16px;
        }

        .gallery-item {
            position: relative;
            break-inside: avoid;
            margin-bottom: 16px;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
            background: #f5f5f7;
        }

        .gallery-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: middle;
        }
            display: block;
            object-fit: cover;
        }

        /* Footer */
        footer {
            background: #f5f5f7;
            padding: 40px 24px;
            text-align: center;
            margin-top: 100px;
        }

        footer p {
            color: #6e6e73;
            font-size: 14px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            background: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .lightbox-arrow:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-arrow.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .lightbox-arrow.disabled:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-50%);
        }

        .lightbox-arrow-prev {
            left: 24px;
        }

        .lightbox-arrow-next {
            right: 24px;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
        }

        .lightbox-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @media (max-width: 768px) {
            .lightbox-arrow {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            .lightbox-arrow-prev {
                left: 12px;
            }

            .lightbox-arrow-next {
                right: 12px;
            }

            .lightbox-close {
                top: 12px;
                right: 12px;
                width: 40px;
                height: 40px;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 18px;
            }

            .gallery-grid {
                column-count: 1;
                column-gap: 0;
            }

            .gallery-item {
                margin-bottom: 16px;
            }

            .nav-links a {
                display: none;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .gallery-grid {
                column-count: 2;
                column-gap: 16px;
            }
        }

        @media (min-width: 1025px) {
            .gallery-grid {
                column-count: 3;
                column-gap: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-content">
            <div class="logo" id="logoDisplay">
                <span class="logo-text">MY PORTFOLIO</span>
            </div>
            <div class="nav-links">
                <a href="#gallery">Gallery</a>
                <a href="#about">About</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1 id="heroTitle">Capturing Moments</h1>
        <p id="heroDescription">Photography is the art of frozen time, the ability to store emotion and feelings within a frame.</p>
    </section>

    <!-- Gallery -->
    <section class="gallery" id="gallery">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Gallery items will be inserted here -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 <span id="footerText">My Photography Portfolio</span>. All rights reserved.</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-overlay" onclick="closeLightbox()"></div>
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        
        <button class="lightbox-arrow lightbox-arrow-prev" id="lightboxPrev" onclick="showPrevImage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="">
        </div>
        
        <button class="lightbox-arrow lightbox-arrow-next" id="lightboxNext" onclick="showNextImage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        
        <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
    </div>

    <script>
        // Storage keys
        const STORAGE_KEY = 'portfolioData';

        // Default data
        const defaultData = {
            logoType: 'text',
            logo: 'MY PORTFOLIO',
            logoImage: null,
            title: 'Capturing Moments',
            description: 'Photography is the art of frozen time, the ability to store emotion and feelings within a frame.',
            footer: 'My Photography Portfolio',
            images: []
        };

        // Load data from localStorage
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : defaultData;
        }

        // Update logo display
        function updateLogoDisplay(data) {
            const logoDisplay = document.getElementById('logoDisplay');
            
            if (data.logoType === 'image' && data.logoImage) {
                logoDisplay.innerHTML = `<img src="${data.logoImage}" alt="Logo">`;
            } else {
                logoDisplay.innerHTML = `<span class="logo-text">${data.logo}</span>`;
            }
        }

        // Render gallery
        function renderGallery(images) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            if (images.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #6e6e73; padding: 40px;">Coming Soon...</p>';
                return;
            }
            
            images.forEach((img, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(img.url);
                item.innerHTML = `<img src="${img.url}" alt="${img.name || 'Gallery image'}" loading="lazy">`;
                grid.appendChild(item);
            });
        }

        // Initialize page
        function initPage() {
            const data = loadData();
            
            // Update logo
            updateLogoDisplay(data);
            
            // Update other UI
            document.getElementById('heroTitle').textContent = data.title;
            document.getElementById('heroDescription').textContent = data.description;
            document.getElementById('footerText').textContent = data.footer;
            
            // Load gallery
            renderGallery(data.images || []);
        }

        // Lightbox state
        let currentImageIndex = 0;
        let allImages = [];

        // Open lightbox
        function openLightbox(imgSrc) {
            const data = loadData();
            allImages = data.images || [];
            
            // Find current image index
            currentImageIndex = allImages.findIndex(img => img.url === imgSrc);
            if (currentImageIndex === -1) currentImageIndex = 0;
            
            showLightboxImage(currentImageIndex);
            
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Add keyboard support
            document.addEventListener('keydown', handleLightboxKeypress);
        }

        // Show specific image in lightbox
        function showLightboxImage(index) {
            if (allImages.length === 0) return;
            
            const img = document.getElementById('lightboxImg');
            const counter = document.getElementById('lightboxCounter');
            const prevBtn = document.getElementById('lightboxPrev');
            const nextBtn = document.getElementById('lightboxNext');
            
            // Update image
            img.src = allImages[index].url;
            
            // Update counter
            counter.textContent = `${index + 1} / ${allImages.length}`;
            
            // Update button states
            if (index === 0) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }
            
            if (index === allImages.length - 1) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        // Show previous image
        function showPrevImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                showLightboxImage(currentImageIndex);
            }
        }

        // Show next image
        function showNextImage() {
            if (currentImageIndex < allImages.length - 1) {
                currentImageIndex++;
                showLightboxImage(currentImageIndex);
            }
        }

        // Close lightbox
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            
            // Remove keyboard listener
            document.removeEventListener('keydown', handleLightboxKeypress);
            
            // Reset
            currentImageIndex = 0;
            allImages = [];
        }

        // Handle keyboard events
        function handleLightboxKeypress(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                showPrevImage();
            } else if (e.key === 'ArrowRight') {
                showNextImage();
            }
        }

        // Initialize on load
        window.onload = initPage;
    </script>
</body>
</html>
